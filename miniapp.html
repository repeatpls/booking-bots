<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Розклад</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#17212B; --card:#1E2A35; --line:#26333F; --ink:#E8EDF2;
  --dim:#7E93A8; --faint:#44576A; --gold:#C9A227; --green:#6FBF8A;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));overflow-x:hidden}
.seg{display:flex;gap:6px;background:#141D26;border-radius:12px;padding:4px;
  margin-bottom:14px}
.segbtn{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:13.5px;
  color:#8CA0B4;font-weight:600;cursor:pointer;transition:background .15s ease}
.segbtn.on{background:var(--gold);color:#15201B}
.dayhdr{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px}
.dayhdr b{font-size:15px;font-weight:700}
.dayhdr span{color:var(--dim);font-size:12px}
.dayhdr:first-of-type{margin-top:4px}
.ln{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.ln .tm{flex:0 0 auto;min-width:42px;text-align:right;font-size:13px;font-weight:700;
  color:var(--dim);font-variant-numeric:tabular-nums}
.item{flex:1;min-width:0;display:flex;gap:11px;background:var(--card);
  border-radius:12px;padding:11px 12px;cursor:pointer;align-items:flex-start;
  border-left:3px solid var(--green);transition:transform .12s ease}
.item:active{transform:scale(.985)}
.item.ipay{border-left-color:var(--gold)}
.item .mid{flex:1;min-width:0}
.item .nm{font-size:14px;font-weight:600}
.item .sv{color:var(--dim);font-size:12px;margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.item .ms{color:#8CA0B4;font-size:11px;background:#223040;border-radius:999px;
  padding:3px 9px;white-space:nowrap;align-self:center}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top b{font-size:17px;font-weight:600}
.top .sub{color:var(--dim);font-size:12px;margin-top:2px}
.nav{color:var(--gold);font-size:26px;padding:4px 12px;user-select:none;cursor:pointer}
.nav:active{opacity:.5}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.wk div{color:#5F7389;font-size:10px;text-align:center;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.d{aspect-ratio:1;border-radius:10px;background:var(--card);color:#9FB2C6;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:14px;cursor:pointer;transition:transform .12s ease}
.d:active{transform:scale(.92)}
.d i{font-style:normal;font-size:9px;margin-top:2px}
.d.l1{background:#23372F;color:#CFE0D4}.d.l1 i{color:var(--green)}
.d.l2{background:#2C4034;color:#DCEAE0}.d.l2 i{color:#8FD6A4}
.d.l3{background:var(--gold);color:#15201B;font-weight:700}.d.l3 i{color:#5A4414}
.d.off{color:#3C4B5A;background:#192330}
.d.today{outline:2px solid var(--gold)}
.legend{display:flex;gap:14px;margin-top:14px;color:var(--dim);font-size:11px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;
  border:1px solid rgba(255,255,255,.08)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 13px;border-radius:999px;background:var(--card);color:#9FB2C6;
  font-size:13px;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--gold);color:#15201B;font-weight:600}
.cols{display:flex;gap:8px;align-items:flex-start}
.col{flex:1;min-width:0}
.hd{color:var(--dim);font-size:10px;text-align:center;margin-bottom:7px;
  font-weight:700;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.slot{border-radius:9px;padding:8px;margin-bottom:6px;font-size:11px;line-height:1.35;
  cursor:pointer;transition:transform .12s ease}
.slot:active{transform:scale(.97)}
.ln .slot{flex:1;min-width:0;margin-bottom:0;font-size:12px}
.ln .slot b{font-size:13px}
.slot b{display:block;font-size:12px;font-weight:600;color:#fff}
.busy{background:#243B33;border-left:3px solid var(--green);color:#D7E6DC}
.pay{background:#3A3420;border-left:3px solid var(--gold);color:#EADFBF}
.gone{background:#2E2328;border-left:3px solid #8A5560;color:#D8BCC2;
  text-decoration:line-through;opacity:.75}
.empty{color:var(--faint);font-size:12px;text-align:center;padding:26px 0}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:10px}
.k{color:var(--dim);font-size:10px;font-weight:600;letter-spacing:.6px;margin-bottom:3px}
.v{font-size:14px;margin-bottom:12px;font-weight:500}
.v:last-child{margin-bottom:0}
.v a{color:#6AB3F3;text-decoration:none;border-bottom:1px solid rgba(106,179,243,.3);
  padding-bottom:1px}
.v a:active{opacity:.6}
.pill{display:inline-block;background:#2C4034;color:#8FD6A4;font-size:11px;
  padding:4px 10px;border-radius:999px;font-weight:600}
.pill.no{background:#3A3420;color:#E3C565}
.back{color:var(--gold);font-size:14px;margin-bottom:12px;cursor:pointer;display:inline-block}
.err{background:#2E2328;border-radius:14px;padding:18px;color:#E7C9CE;font-size:14px;
  line-height:1.5;text-align:center;margin-top:40px}
.load{color:var(--dim);text-align:center;padding:50px 0;font-size:13px}
.daygrp.closed .ln.ex{display:none}
.more{display:flex;align-items:center;justify-content:center;gap:7px;
  background:var(--card);border-radius:12px;padding:11px;margin-bottom:8px;
  color:var(--gold);font-size:13px;font-weight:600;cursor:pointer}
.more:active{opacity:.6}
.more i{font-style:normal;font-size:10px;opacity:.8}
.mcard{background:var(--card);border-radius:14px;padding:13px 14px 11px;margin-bottom:9px}
.mcard .who{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.mcard .who b{font-size:14.5px;font-weight:650}
.mcard .who span{color:var(--dim);font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#23372F;color:#CFE0D4;border:1px solid #2F4A3E;border-radius:9px;
  padding:7px 11px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;
  cursor:pointer;transition:transform .12s ease,background .12s ease}
.chip:active{transform:scale(.94);background:var(--green);color:#15201B;
  border-color:var(--green)}
.note{color:var(--faint);font-size:11.5px;line-height:1.5;margin-top:14px;
  text-align:center}
.d.fr{background:#23372F;color:#CFE0D4}.d.fr i{color:var(--green)}
.d.fr2{background:#2C4034;color:#DCEAE0}.d.fr2 i{color:#8FD6A4}
.d.full{background:#1B2631;color:#5A6E82}.d.full i{color:#3C4B5A}
.d.past{background:transparent;color:#35444F}.d.past i{color:#2B3843}
</style>
</head>
<body>
<div id="app"><div class="load">Хвилинку…</div></div>

<script>
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

var BASE = location.pathname.replace(/\/+$/, "");
var INIT = tg ? tg.initData : "";
var app = document.getElementById("app");
var MON = ["січня","лютого","березня","квітня","травня","червня","липня",
           "серпня","вересня","жовтня","листопада","грудня"];
var MONTH_N = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень",
               "Серпень","Вересень","Жовтень","Листопад","Грудень"];
var DOW = ["пн","вт","ср","чт","пт","сб","нд"];
var view = { ym: null, day: null, master: "all", lmaster: "all",
             data: null, tab: "cal", open: {} };

/* Два режими однієї сторінки. Власник і робоча група бачать записи;
   клієнт — тільки вільні години, без чужих імен і телефонів.
   Режим приходить із самої кнопки, а дані все одно розділяє сервер. */
var start_param = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
var FREE = /[?&]v=free/.test(location.search) || start_param === "free";

function api(path, params) {
  var q = "init=" + encodeURIComponent(INIT);
  for (var k in params) q += "&" + k + "=" + encodeURIComponent(params[k]);
  return fetch(BASE + "/api/" + path + "?" + q).then(function (r) {
    return r.json().then(function (j) {
      if (!r.ok) throw new Error(j.error || "Не вдалося завантажити");
      return j;
    });
  });
}

function pad(n) { return n < 10 ? "0" + n : "" + n; }
function todayISO() { var d = new Date();
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function esc(s) { return String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function money(n) { return (n == null || n === "") ? "" : String(n); }

function fail(msg) {
  app.innerHTML = '<div class="err">' + esc(msg) + '</div>';
}

function seg() {
  return '<div class="seg">' +
    '<div class="segbtn' + (view.tab === "cal" ? " on" : "") + '" id="t-cal">Календар</div>' +
    '<div class="segbtn' + (view.tab === "list" ? " on" : "") + '" id="t-list">Список</div>' +
    "</div>";
}

function wire_seg() {
  var a = document.getElementById("t-cal"), b = document.getElementById("t-list");
  if (a) a.onclick = function () {
    if (view.tab === "cal") return;
    view.tab = "cal";
    showMonth(view.ym || todayISO().slice(0, 7));
  };
  if (b) b.onclick = function () {
    if (view.tab === "list") return;
    view.tab = "list"; showList();
  };
}

function wire_lm(j) {
  Array.prototype.forEach.call(document.querySelectorAll("[data-lm]"),
    function (el) {
      el.onclick = function () {
        var m = el.getAttribute("data-lm");
        if (m === view.lmaster) return;
        view.lmaster = m;
        view.open = {};
        showList();
      };
    });
}

/* ---------- список усіх найближчих записів ---------- */
function showList() {
  app.innerHTML = seg() + '<div class="load">Хвилинку…</div>';
  wire_seg();
  api("list", {}).then(function (j) {
    view.data = j;
    var h = seg();
    if (!j.rows.length) {
      h += '<div class="empty">Попереду записів немає</div>';
      app.innerHTML = h; wire_seg(); return;
    }
    // Вибір майстра: той самий, що і в календарі, щоб не вчити двічі.
    var ms = j.masters || [];
    if (ms.length > 1) {
      h += '<div class="tabs"><div class="tab' +
        (view.lmaster === "all" ? " on" : "") + '" data-lm="all">Усі</div>';
      ms.forEach(function (m) {
        h += '<div class="tab' + (view.lmaster === m.id ? " on" : "") +
             '" data-lm="' + esc(m.id) + '">' + esc(m.name) + "</div>";
      });
      h += "</div>";
    }
    var rows = view.lmaster === "all" ? j.rows : j.rows.filter(function (r) {
      return r.master_id === view.lmaster; });
    if (!rows.length) {
      h += '<div class="empty">У цього майстра попереду записів немає</div>';
      app.innerHTML = h; wire_seg(); wire_lm(j); return;
    }
    // Довгий день згортаємо: перші кілька записів видно одразу,
    // решта розкривається дотиком. Інакше в завантажений день
    // доводиться гортати екран за екраном, щоб дійти до завтра.
    var SHOW = 4;
    var byday = [], index = {};
    rows.forEach(function (r) {
      var d = r.slot.slice(0, 10);
      if (index[d] === undefined) { index[d] = byday.length; byday.push([d, []]); }
      byday[index[d]][1].push(r);
    });
    byday.forEach(function (pair) {
      var d = pair[0], rows = pair[1];
      var dt = new Date(d + "T00:00");
      var open = view.open[d] || rows.length <= SHOW + 1;
      h += '<div class="dayhdr"><b>' + dayName(dt) + ", " + dt.getDate() + " " +
           MON[dt.getMonth()] + '</b><span>' + rows.length + " " +
           plural(rows.length) + "</span></div>";
      h += '<div class="daygrp' + (open ? "" : " closed") + '" data-g="' + d + '">';
      rows.forEach(function (r, i) {
        h += '<div class="ln' + (i >= SHOW ? " ex" : "") +
             '" data-id="' + r.id + '">' +
             '<div class="tm">' + esc(r.slot.slice(11, 16)) + "</div>" +
             '<div class="item' + (r.paid ? " ipay" : "") + '">' +
             '<div class="mid"><div class="nm">' + esc(r.name || "—") + "</div>" +
             '<div class="sv">' + esc(r.service || "") +
             (r.price ? " · " + esc(r.price) : "") + "</div></div>" +
             (r.master_name && view.lmaster === "all"
               ? '<div class="ms">' + esc(r.master_name) + "</div>" : "") +
             "</div></div>";
      });
      h += "</div>";
      if (rows.length > SHOW + 1) {
        h += '<div class="more" data-more="' + d + '">' +
             (open ? "Згорнути день <i>▲</i>"
                   : "Ще " + (rows.length - SHOW) + " " +
                     plural(rows.length - SHOW) + " <i>▼</i>") + "</div>";
      }
    });
    app.innerHTML = h;
    wire_seg();
    wire_lm(j);
    Array.prototype.forEach.call(app.querySelectorAll("[data-more]"), function (el) {
      el.onclick = function () {
        // Розкриваємо прямо на місці, без перемальовування списку:
        // інакше сторінка стрибає вгору і людина губить місце.
        var d = el.getAttribute("data-more");
        var grp = app.querySelector('.daygrp[data-g="' + d + '"]');
        if (!grp) return;
        var open = !grp.classList.contains("closed");
        open = !open;
        view.open[d] = open;
        grp.classList.toggle("closed", !open);
        var hidden = grp.querySelectorAll(".ln.ex").length;
        el.innerHTML = open ? "Згорнути день <i>\u25B2</i>"
                            : "Ще " + hidden + " " + plural(hidden) + " <i>\u25BC</i>";
      };
    });
    Array.prototype.forEach.call(app.querySelectorAll("[data-id]"), function (el) {
      el.onclick = function () {
        var id = +el.getAttribute("data-id"), row = null;
        j.rows.forEach(function (r) { if (r.id === id) row = r; });
        if (row) showBooking(row, null);
      };
    });
    if (tg && tg.BackButton) tg.BackButton.hide();
  }).catch(function (e) { fail(e.message); });
}

function dayName(d) {
  var n = ["Неділя","Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота"];
  return n[d.getDay()];
}

/* ---------- місяць ---------- */
function showMonth(ym) {
  view.ym = ym;
  app.innerHTML = '<div class="load">Хвилинку…</div>';
  api("month", { m: ym }).then(function (j) {
    view.data = j;
    var y = +ym.slice(0, 4), m = +ym.slice(5, 7);
    var first = new Date(y, m - 1, 1);
    var shift = (first.getDay() + 6) % 7;          // понеділок перший
    var total = new Date(y, m, 0).getDate();
    var prev = new Date(y, m - 1, 0).getDate();
    var h = seg() + '<div class="top"><div class="nav" id="pm">‹</div>' +
      '<div style="text-align:center"><b>' + MONTH_N[m - 1] + " " + y + "</b>" +
      '<div class="sub">' + esc(j.business || "") +
      (j.only ? " · ваші записи" : "") + '</div></div>' +
      '<div class="nav" id="nm">›</div></div>';
    h += '<div class="wk">' + DOW.map(function (d) {
      return "<div>" + d + "</div>"; }).join("") + "</div><div class='cal'>";
    for (var i = shift; i > 0; i--)
      h += '<div class="d off">' + (prev - i + 1) + "</div>";
    for (var dnum = 1; dnum <= total; dnum++) {
      var iso = y + "-" + pad(m) + "-" + pad(dnum);
      var n = j.days[iso] || 0;
      var cls = n === 0 ? "" : (n <= 3 ? " l1" : (n <= 6 ? " l2" : " l3"));
      if (iso === todayISO()) cls += " today";
      h += '<div class="d' + cls + '" data-d="' + iso + '">' + dnum +
           (n ? "<i>" + n + "</i>" : "<i>·</i>") + "</div>";
    }
    h += "</div>";
    h += '<div class="legend">' +
      '<span><i class="sw" style="background:#23372F"></i>вільно</span>' +
      '<span><i class="sw" style="background:#2C4034"></i>половина</span>' +
      '<span><i class="sw" style="background:#C9A227"></i>щільно</span></div>';
    app.innerHTML = h;
    wire_seg();
    document.getElementById("pm").onclick = function () { showMonth(step(ym, -1)); };
    document.getElementById("nm").onclick = function () { showMonth(step(ym, 1)); };
    Array.prototype.forEach.call(app.querySelectorAll("[data-d]"), function (el) {
      el.onclick = function () { showDay(el.getAttribute("data-d")); };
    });
    if (tg && tg.BackButton) tg.BackButton.hide();
  }).catch(function (e) { fail(e.message); });
}

function step(ym, k) {
  var y = +ym.slice(0, 4), m = +ym.slice(5, 7) + k;
  if (m === 0) { m = 12; y--; } else if (m === 13) { m = 1; y++; }
  return y + "-" + pad(m);
}

/* ---------- день ---------- */
function showDay(iso) {
  view.day = iso;
  app.innerHTML = '<div class="load">Хвилинку…</div>';
  api("day", { d: iso }).then(function (j) {
    view.data = j;
    render_day(j);
    if (tg && tg.BackButton) {
      tg.BackButton.show();
      tg.BackButton.onClick(function () { showMonth(view.ym || iso.slice(0, 7)); });
    }
  }).catch(function (e) { fail(e.message); });
}

function render_day(j) {
  var d = new Date(j.day + "T00:00");
  var h = '<div class="top"><div><b>' + d.getDate() + " " + MON[d.getMonth()] +
    '</b><div class="sub">' + j.rows.length + " " + plural(j.rows.length) +
    '</div></div><div class="nav" id="back">✕</div></div>';

  var ms = j.masters && j.masters.length ? j.masters : [{ id: "", name: "Записи" }];
  if (ms.length > 1) {
    h += '<div class="tabs"><div class="tab' +
      (view.master === "all" ? " on" : "") + '" data-m="all">Усі</div>';
    ms.forEach(function (m) {
      h += '<div class="tab' + (view.master === m.id ? " on" : "") +
           '" data-m="' + esc(m.id) + '">' + esc(m.name) + "</div>";
    });
    h += "</div>";
  }

  var shown = view.master === "all" ? ms : ms.filter(function (m) {
    return m.id === view.master; });
  if (!shown.length) shown = ms;

  var one = shown.length === 1;
  var any = false;
  h += '<div class="cols">';
  shown.forEach(function (m) {
    h += '<div class="col">';
    if (shown.length > 1) h += '<div class="hd">' + esc(m.name) + "</div>";
    var mine = j.rows.filter(function (r) {
      return !m.id || r.master_id === m.id; });
    if (!mine.length) {
      h += '<div class="empty">вільно</div>';
    } else {
      any = true;
      mine.forEach(function (r) {
        var cls = r.status === "cancelled" ? "gone" : (r.paid ? "pay" : "busy");
        var body = esc(r.service || "");
        if (one) {
          // Один майстер — колонка на всю ширину, тож час виносимо ліворуч,
          // як у списку. У кількох колонках місця на це немає.
          h += '<div class="ln" data-id="' + r.id + '">' +
            '<div class="tm">' + esc(r.slot.slice(11, 16)) + "</div>" +
            '<div class="slot ' + cls + '"><b>' + esc(r.name || "") + "</b>" +
            body + "</div></div>";
        } else {
          h += '<div class="slot ' + cls + '" data-id="' + r.id + '"><b>' +
            esc(r.slot.slice(11, 16)) + "</b>" + esc(r.name || "") +
            (body ? "<br>" + body : "") + "</div>";
        }
      });
    }
    h += "</div>";
  });
  h += "</div>";
  if (!any) h = h.replace('<div class="cols">',
    '<div class="empty">На цей день записів немає</div><div class="cols" hidden>');

  app.innerHTML = h;
  document.getElementById("back").onclick = function () {
    showMonth(view.ym || j.day.slice(0, 7)); };
  Array.prototype.forEach.call(app.querySelectorAll("[data-m]"), function (el) {
    el.onclick = function () {
      view.master = el.getAttribute("data-m"); render_day(j); };
  });
  Array.prototype.forEach.call(app.querySelectorAll("[data-id]"), function (el) {
    el.onclick = function () {
      var id = +el.getAttribute("data-id");
      var row = null;
      j.rows.forEach(function (r) { if (r.id === id) row = r; });
      if (row) showBooking(row, j);
    };
  });
}

function plural(n) {
  var a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return "запис";
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return "записи";
  return "записів";
}

/* ---------- клієнт: місяць із вільними годинами ---------- */
function showFree(ym) {
  view.ym = ym;
  app.innerHTML = '<div class="load">Хвилинку…</div>';
  api("freemonth", { m: ym }).then(function (j) {
    var y = +ym.slice(0, 4), m = +ym.slice(5, 7);
    var first = new Date(y, m - 1, 1);
    var shift = (first.getDay() + 6) % 7;
    var total = new Date(y, m, 0).getDate();
    var prev = new Date(y, m - 1, 0).getDate();

    var h = '<div class="top"><div class="nav" id="pm">‹</div>' +
      '<div style="text-align:center"><b>' + MONTH_N[m - 1] + " " + y + "</b>" +
      '<div class="sub">' + esc(j.business || "") + " · вільні години</div></div>" +
      '<div class="nav" id="nm">›</div></div>';
    h += '<div class="wk">' + DOW.map(function (d) {
      return "<div>" + d + "</div>"; }).join("") + "</div><div class='cal'>";
    for (var i = shift; i > 0; i--)
      h += '<div class="d past">' + (prev - i + 1) + "</div>";
    var today = todayISO();
    for (var dnum = 1; dnum <= total; dnum++) {
      var iso = y + "-" + pad(m) + "-" + pad(dnum);
      var n = j.days[iso] || 0;
      var cls, mark;
      if (iso < today || iso > j.horizon) { cls = " past"; mark = ""; }
      else if (!n) { cls = " full"; mark = "—"; }
      else { cls = n >= 6 ? " fr2" : " fr"; mark = n; }
      if (iso === today) cls += " today";
      h += '<div class="d' + cls + '"' + (n && iso >= today && iso <= j.horizon ?
           ' data-d="' + iso + '"' : "") + ">" + dnum +
           "<i>" + mark + "</i></div>";
    }
    h += "</div>";
    h += '<div class="legend">' +
      '<span><i class="sw" style="background:#23372F"></i>є вільні години</span>' +
      '<span><i class="sw" style="background:#192330"></i>зайнято</span></div>';
    h += '<div class="note">Цифра — скільки вільних годин того дня.<br>' +
         'Натисніть день, щоб побачити їх по майстрах.</div>';
    app.innerHTML = h;
    document.getElementById("pm").onclick = function () { showFree(step(ym, -1)); };
    document.getElementById("nm").onclick = function () { showFree(step(ym, 1)); };
    Array.prototype.forEach.call(app.querySelectorAll("[data-d]"), function (el) {
      el.onclick = function () { showFreeDay(el.getAttribute("data-d")); };
    });
    if (tg && tg.BackButton) tg.BackButton.hide();
  }).catch(function (e) { fail(e.message); });
}

/* ---------- клієнт: один день ---------- */
function showFreeDay(iso) {
  view.day = iso;
  app.innerHTML = '<div class="load">Хвилинку…</div>';
  api("freeday", { d: iso }).then(function (j) {
    var d = new Date(j.day + "T00:00");
    var all = 0;
    j.free.forEach(function (m) { all += m.times.length; });
    var h = '<div class="top"><div><b>' + dayName(d) + ", " + d.getDate() + " " +
      MON[d.getMonth()] + '</b><div class="sub">' + all + " " +
      hours_word(all) + '</div></div><div class="nav" id="back">✕</div></div>';

    if (!j.free.length) {
      h += '<div class="empty">Цього дня вільних годин немає</div>';
    } else {
      j.free.forEach(function (m) {
        h += '<div class="mcard"><div class="who"><b>' + esc(m.name) + "</b>" +
             (m.role ? "<span>" + esc(m.role) + "</span>" : "") + "</div>" +
             '<div class="chips">' + m.times.map(function (t) {
               return '<span class="chip" data-t="' + esc(t) +
                      '" data-i="' + esc(m.i) + '">' + esc(t) + "</span>";
             }).join("") + "</div></div>";
      });
      h += '<div class="note">' + (j.bot
             ? "Натисніть годину — бот спитає послугу і займе цей час."
             : "Щоб зайняти годину, поверніться в бот " +
               "і натисніть «Записатися».") + "</div>";
    }
    app.innerHTML = h;
    document.getElementById("back").onclick = function () {
      showFree(view.ym || j.day.slice(0, 7)); };
    if (j.bot) {
      Array.prototype.forEach.call(app.querySelectorAll("[data-t]"),
        function (el) { el.onclick = function () { take(j, el); }; });
    }
    if (tg && tg.BackButton) {
      tg.BackButton.show();
      tg.BackButton.onClick(function () {
        showFree(view.ym || iso.slice(0, 7)); });
    }
  }).catch(function (e) { fail(e.message); });
}

/* Повертаємо людину в бот із обраною годиною.

   Самому записати ми звідси не можемо: сторінка не знає, хто це, доки
   Telegram не підпише дані, і не має права чіпати базу. Тому передаємо
   вибір боту звичайним посиланням — далі він питає послугу і займає час. */
function take(j, el) {
  var hhmm = el.getAttribute("data-t").replace(":", "");
  var code = "t-" + el.getAttribute("data-i") + "-" +
             j.day.replace(/-/g, "") + hhmm;
  var url = "https://t.me/" + j.bot + "?start=" + code;
  el.style.background = "var(--green)";
  el.style.color = "#15201B";
  if (tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred)
    tg.HapticFeedback.impactOccurred("light");
  if (tg && tg.openTelegramLink) {
    tg.openTelegramLink(url);
    // деякі клієнти лишають застосунок відкритим поверх чату —
    // закриваємо самі, але не миттєво, щоб перехід устиг піти
    setTimeout(function () { if (tg.close) tg.close(); }, 250);
  } else { location.href = url; }
}

function hours_word(n) {
  var a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return "вільна година";
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return "вільні години";
  return "вільних годин";
}

/* ---------- картка запису ---------- */
function showBooking(r, dayData) {
  var d = new Date(r.slot);
  var due = "";
  var price = parseInt(String(r.price || "").replace(/[^\d]/g, ""), 10);
  if (price && r.deposit) due = Math.max(0, price - r.deposit) + " ₴";

  var h = '<div class="back" id="back">‹ назад</div>';
  h += '<div class="card"><div class="k">КОЛИ</div><div class="v">' +
    d.getDate() + " " + MON[d.getMonth()] + " · " +
    esc(r.slot.slice(11, 16)) + "</div>";
  h += '<div class="k">ПОСЛУГА</div><div class="v">' + esc(r.service || "—") +
    (r.minutes ? " · " + r.minutes + " хв" : "") +
    (r.price ? " · " + esc(r.price) : "") + "</div>";
  if (r.master_name)
    h += '<div class="k">МАЙСТЕР</div><div class="v">' + esc(r.master_name) + "</div>";
  h += "</div>";

  h += '<div class="card"><div class="k">КЛІЄНТ</div><div class="v">' +
    esc(r.name || "—") + "</div>";
  if (r.phone) h += '<div class="k">ТЕЛЕФОН</div><div class="v"><a href="tel:' +
    esc(r.phone) + '">' + esc(r.phone) + "</a></div>";
  if (r.username) h += '<div class="k">TELEGRAM</div><div class="v">' +
    '<a href="https://t.me/' + esc(r.username) + '" class="tgl" data-u="' +
    esc(r.username) + '">@' + esc(r.username) + "</a></div>";
  if (r.comment) h += '<div class="k">КОМЕНТАР</div><div class="v">' +
    esc(r.comment) + "</div>";
  h += "</div>";

  if (r.deposit) {
    h += '<div class="card"><div class="k">ОПЛАТА</div><div class="v">' +
      (r.paid ? '<span class="pill">Передоплата ' + money(r.deposit) +
                ' ₴ прийнята</span>'
              : '<span class="pill no">Чекає передоплату ' + money(r.deposit) +
                ' ₴</span>') + "</div>";
    if (due) h += '<div class="k">ЗАЛИШОК НА МІСЦІ</div><div class="v">' + due + "</div>";
    h += "</div>";
  }

  app.innerHTML = h;
  document.getElementById("back").onclick = function () {
    if (dayData) { render_day(dayData); } else { showList(); }
  };
  // чат із клієнтом відкриваємо всередині Telegram, а не в браузері
  Array.prototype.forEach.call(app.querySelectorAll("a.tgl"), function (el) {
    el.onclick = function (e) {
      if (tg && tg.openTelegramLink) {
        e.preventDefault();
        tg.openTelegramLink("https://t.me/" + el.getAttribute("data-u"));
      }
    };
  });
}

/* ---------- старт ---------- */
if (!INIT) {
  fail("Відкрийте розклад кнопкою в боті — сторінка працює лише звідти.");
} else {
  var t = new Date();
  var ym0 = t.getFullYear() + "-" + pad(t.getMonth() + 1);
  if (FREE) { document.title = "Вільні години"; showFree(ym0); }
  else { showMonth(ym0); }
}
</script>
